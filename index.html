<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#b0b3b7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Beschlagenes Glas (Shader)</title>
</head>
<body style="margin:0">

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Vollbild-Glasscheibe, darüber nur ein Hinweis oben und eine schmale Leiste unten. */
:root {
  --bg: #0b121b;
  --ink: #e3edf5;
  --mute: rgba(227, 237, 245, .68);
  --pill: rgba(10, 18, 28, .55);
  --line: rgba(227, 237, 245, .22);
  --accent: #c9ccd0;
  --accent-soft: rgba(201, 204, 208, .2);
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#glass {
  position: fixed;
  left: 0;
  top: 0;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
.ui {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  pointer-events: none;
}
.top {
  max-width: 34em;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hint {
  margin: 0;
  font-size: 13px;
  letter-spacing: .02em;
  color: rgba(34, 38, 42, .72);
  text-shadow: 0 1px 6px rgba(255, 255, 255, .5);
  animation: dim 1.6s 9s forwards;
}
.note {
  margin: 0;
  font-size: 13px;
  color: rgba(34, 38, 42, .85);
  text-shadow: 0 1px 6px rgba(255, 255, 255, .5);
  min-height: 1.4em;
}
@keyframes dim { to { opacity: .4; } }
.bar[hidden] { display: none !important; }
.bar {
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 10px 10px 10px;
  max-width: 100%;
  box-sizing: border-box;
  background: var(--pill);
  border: 1px solid var(--line);
  border-radius: 22px;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.bar-label {
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--mute);
}
.modes {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
}
.modes button {
  appearance: none;
  min-height: 40px;
  padding: 0 13px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font: inherit;
  cursor: pointer;
}
.modes button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: #f2fbff;
}
.modes button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  .hint { animation: none; }
}
  .tilt { align-self: stretch; width: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; gap: 4px; margin-top: 10px; font-size: 12px; opacity: .9; }
  .tilt input { width: 100%; accent-color: var(--accent); }
  .tilt b { font-weight: 600; }
</style>

<canvas id="glass" aria-label="Beschlagene Glasscheibe mit Wassertropfen"></canvas>
<div class="ui">
  <div class="top">
    <p class="note" id="note" role="status" aria-live="polite" hidden></p>
  </div>
  <div class="bar" id="bar" hidden>
    <span class="bar-label">Lage des Glases</span>
    <div class="modes" role="group" aria-label="Lage des Glases">
      <button type="button" data-mode="up" aria-pressed="true" title="Aufrecht gehalten: Tropfen laufen nach unten">Aufrecht</button>
      <button type="button" data-mode="left" aria-pressed="false" title="Nach links geneigt: Tropfen laufen nach links unten">Links</button>
      <button type="button" data-mode="right" aria-pressed="false" title="Nach rechts geneigt: Tropfen laufen nach rechts unten">Rechts</button>
      <button type="button" data-mode="flat" aria-pressed="false" title="Flach gehalten: Tropfen bleiben stehen und wachsen">Flach</button>
      <button type="button" data-mode="sensor" aria-pressed="false" title="Lagesensor des Handys verwenden">Sensor</button>
    </div>
    <label class="tilt"><span>Neigung <b id="tiltv">90°</b></span><input type="range" id="tilt" min="0" max="90" step="0.5" value="90" aria-label="Neigung des Glases in Grad, 0 flach bis 90 aufrecht"></label>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TAU = Math.PI * 2;
  var cv = document.getElementById('glass');
  var ctx = cv.getContext('2d');
  var glc = document.createElement('canvas');
  var gl = null;
  try { gl = glc.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' }); } catch (errGL) { gl = null; }
  var glOK = !!gl;
  var bg = document.createElement('canvas');
  var bctx = bg.getContext('2d');
  var fog = document.createElement('canvas');
  var fctx = fog.getContext('2d');
  var pm = document.createElement('canvas');
  var pmc = pm.getContext('2d');
  var pl = document.createElement('canvas');
  var plc = pl.getContext('2d');
  var ll = document.createElement('canvas');
  var llc = ll.getContext('2d');
  var lakeBox = { x0: 0, y0: 0, x1: 0, y1: 0 };
  var layerStale = true, lakeRefog = false;
  var noteEl = document.getElementById('note');

  var W = 0, H = 0, dpr = 1;
  var drops = [];
  var tick = 0;
  var fogGrad = null;
  var CAP = 900;
  var idc = 0;
  var ARM0 = 19;
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var SPEED = reduce ? 0.5 : 1;

  var grav = { x: 0, y: 1, m: 1 };
  var gT = { x: 0, y: 1, m: 1 };
  var mode = 'up';

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function seeded(seed) {
    return function () {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }

  /* ---------- Hintergrund: hinterleuchtete Fläche, sehr unscharf ---------- */
  var blobs = [];

  function initBlobs() {
    var r = seeded(11);
    var cols = [[255, 255, 255], [120, 124, 128], [255, 255, 255], [90, 94, 98]];
    blobs = [];
    for (var i = 0; i < 16; i++) {
      blobs.push({
        c: cols[i % cols.length].join(','),
        x: r(), y: r(),
        rad: 0.18 + r() * 0.3,
        a: 0.02 + r() * 0.03,
        sx: 0.04 + r() * 0.08, sy: 0.03 + r() * 0.07,
        px: r() * TAU, py: r() * TAU,
        ax: 0.04 + r() * 0.1, ay: 0.03 + r() * 0.08
      });
    }
  }

  function paintBg(t) {
    bctx.setTransform(bg.width / W, 0, 0, bg.height / H, 0, 0);
    bctx.globalCompositeOperation = 'source-over';
    var g = bctx.createLinearGradient(0, 0, W * 0.4, H);
    g.addColorStop(0, '#c2c5c8');
    g.addColorStop(0.55, '#b0b3b7');
    g.addColorStop(1, '#9ea2a6');
    bctx.fillStyle = g;
    bctx.fillRect(0, 0, W, H);
    bctx.globalCompositeOperation = 'lighter';
    var m = Math.max(W, H);
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      var x = (b.x + Math.sin(t * b.sx + b.px) * b.ax) * W;
      var y = (b.y + Math.sin(t * b.sy + b.py) * b.ay) * H;
      var rad = b.rad * m * 0.55;
      var gr = bctx.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, 'rgba(' + b.c + ',' + b.a.toFixed(2) + ')');
      gr.addColorStop(1, 'rgba(' + b.c + ',0)');
      bctx.fillStyle = gr;
      bctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    bctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- Beschlag ---------- */
  function fillFog(alpha) {
    fctx.globalCompositeOperation = 'source-over';
    fctx.globalAlpha = alpha;
    fctx.fillStyle = fogGrad;
    fctx.fillRect(0, 0, W, H);
    fctx.globalAlpha = 1;
  }

  function micClear(x0, y0, x1, y1, w) {
    if (!emi) return;
    var len = Math.hypot(x1 - x0, y1 - y0), st = Math.max(1, Math.ceil(len / 3)), rad = Math.max(1, w * 0.5);
    for (var s = 0; s <= st; s++) {
      var px = x0 + (x1 - x0) * s / st, py = y0 + (y1 - y0) * s / st;
      var cx0 = Math.max(0, Math.floor((px - rad) / WC)), cx1 = Math.min(wcols - 1, Math.floor((px + rad) / WC));
      var cy0 = Math.max(0, Math.floor((py - rad) / WC)), cy1 = Math.min(wrows - 1, Math.floor((py + rad) / WC));
      for (var cy = cy0; cy <= cy1; cy++) for (var cx = cx0; cx <= cx1; cx++) {
        var k = cy * wcols + cx;
        if (emi[k] > 0.03) emi[k] = 0.03;
      }
    }
  }

  function wipeLine(x0, y0, x1, y1, w) {
    micClear(x0, y0, x1, y1, w);
    fctx.globalCompositeOperation = 'destination-out';
    fctx.lineCap = 'round';
    fctx.lineJoin = 'round';
    fctx.lineWidth = w;
    fctx.strokeStyle = '#000';
    fctx.beginPath();
    fctx.moveTo(x0, y0);
    fctx.lineTo(x1, y1);
    fctx.stroke();
    fctx.globalCompositeOperation = 'source-over';
  }

  function wipeDot(x, y, rad) {
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = '#000';
    fctx.beginPath();
    fctx.arc(x, y, rad, 0, TAU);
    fctx.fill();
    fctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- Tropfen ---------- */
  function addDrop(x, y, r) {
    var d = { id: (++idc & 0xffff) || 1, x: x, y: y, r: r, vx: 0, vy: 0, hx: 0, hy: 1, zig: 0, phase: 0, timer: 0, age: 0, wv: 0, into: null, held: false, arm: null, nm: 0, ghost: 0, hue: 150 + Math.random() * 80, p1: Math.random() * TAU, p2: Math.random() * TAU, p3: Math.random() * TAU, slide: false, dead: false, trail: 0, shed: 0, thr: rnd(0.92, 1.12), pearlGap: rnd(10, 24) };
    drops.push(d);
    return d;
  }

  /* Abgerissenes Wasser liegt zuerst als dünner Film in der frischen Spur. Erst wenn die Spur abgetrocknet ist,
     zieht sich der Film zu Perlen zusammen. Bis dahin gibt es dort keine Tröpfchen. */
  var pearlQ = [];
  function queueTrailDrop(x, y, r) {
    var wi0 = wetIdx(x, y);
    /* nur was wirklich in der Spur liegt, wird zum Film; sonst bleibt nichts zurück */
    if (wi0 >= 0 && wet[wi0] > PEARL_WET && pearlQ.length < 500) pearlQ.push({ x: x, y: y, r: r, t: tick });
    return null;
  }
  function processPearls() {
    for (var i = pearlQ.length - 1; i >= 0; i--) {
      var p = pearlQ[i], wi = wetIdx(p.x, p.y);
      if (tick - p.t > 4000 || wi < 0) { pearlQ.splice(i, 1); continue; }
      if (wet[wi] > PEARL_WET) continue;
      var dd = addDrop(p.x, p.y, p.r);
      dd.nm = 20;
      pearlQ.splice(i, 1);
    }
  }
  var PEARL_WET = 60;
  /* Ab dieser Neigung (sin) gibt es keine ruhenden Wasserflächen mehr: kritischer Radius 5.6/sqrt(m) liegt unter dem Seeradius */
  var FLAT_ON = 0.22, FLAT_OFF = 0.3;
  var PIN_CAP = 1.1, RUNCAP = 11.5, LEAK_K = 2.4;   /* Seen größer als LEAK_K * kritischer Tropfenradius brechen nach unten durch */
  var EMIT_K = 1.7;
  function emitDrop(r, hmax) {
    for (var t = 0; t < 4; t++) {
      var x = rnd(0, W), y = rnd(0, H * hmax), wi = wetIdx(x, y);
      if (wi < 0 || wet[wi] > 0) continue;
      var q = Math.min(1, mic[wi] / 0.7) * emi[wi];
      if (Math.random() < q * q * q) return addDrop(x, y, r);
    }
    return null;
  }

  function seedDrops() {
    drops = [];
    pearlQ = [];
    var i;
    for (i = 0; i < 150; i++) addDrop(rnd(0, W), rnd(0, H), rnd(0.8, 1.9));
    for (i = 0; i < 26; i++) addDrop(rnd(0, W), rnd(0, H), rnd(2.5, 4.6));
    for (i = 0; i < 2; i++) addDrop(rnd(0, W), rnd(0, H * 0.7), rnd(5, 6.6));
  }

  function rSlide() {
    var m = Math.max(grav.m, 0.02);
    return Math.min(60, 5.6 / Math.sqrt(m));
  }

  /* Der kleinere Tropfen wird vom größeren aufgenommen: er wandert hinein und schrumpft dabei. */
  function startMerge(a, b) {
    if (a.into || b.into || a.dead || b.dead || a.nm > 0 || b.nm > 0) return;
    var big = a.r >= b.r ? a : b;
    var small = big === a ? b : a;
    var wasSmallSliding = small.slide;
    small.into = big;
    small.slide = false;
    if (big.slide && !wasSmallSliding) {
      /* Berührung: die Kontaktlinie des Läufers bleibt am Nachbarn hängen, die Bahn knickt zu ihm hin ab */
      var kx = small.x - big.x, ky = small.y - big.y, kl = Math.hypot(kx, ky) || 1;
      var ratio = (small.r * small.r) / (big.r * big.r + small.r * small.r);
      var imp = (0.12 + 1.25 * Math.sqrt(ratio)) * SPEED;
      if (kx * grav.x + ky * grav.y < 0) imp *= 0.25;   /* gegen die Schwerkraft zieht ein kleiner Nachbar kaum */
      big.vx = big.vx * (1 - 0.6 * ratio) + (kx / kl) * imp;
      big.vy = big.vy * (1 - 0.6 * ratio) + (ky / kl) * imp * 0.7;
    }
    if (small.held) {
      small.held = false;
      if (big.r < ARM0) big.held = true;
    }
  }

  function flowMerges(f) {
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      if (!d.into || d.dead) continue;
      var B = d.into;
      if (B.dead) { d.into = null; continue; }
      var dd = Math.hypot(B.x - d.x, B.y - d.y);
      if (dd > (B.r + d.r) * 1.7 + 3) { d.into = null; continue; }
      var A = d.r * d.r, AB = B.r * B.r;
      var dA = Math.min(A, Math.max(A * 0.4 * f, 0.3));   /* Verschmelzen geschieht blitzschnell */
      var wB = dA / (AB + dA);
      B.x += (d.x - B.x) * wB;
      B.y += (d.y - B.y) * wB;
      B.vx = (B.vx * AB + d.vx * dA) / (AB + dA);
      B.vy = (B.vy * AB + d.vy * dA) / (AB + dA);
      var dv = Math.hypot(d.vx, d.vy);
      if (!B.slide && dv > 0.6) {
        B.slide = true;
        B.phase = 1;
        B.timer = 12;
        B.hx = d.vx / dv;
        B.hy = d.vy / dv;
        B.age = 40;
      }
      d.x += (B.x - d.x) * Math.min(1, 0.6 * f);
      d.y += (B.y - d.y) * Math.min(1, 0.6 * f);
      d.vx *= 0.85;
      d.vy *= 0.85;
      B.r = Math.min(140, Math.sqrt(AB + dA));
      d.r = Math.sqrt(Math.max(0, A - dA));
      if (d.r < 0.7) d.dead = true;
    }
  }

  function resize() {
    var w = Math.max(1, window.innerWidth);
    var h = Math.max(1, window.innerHeight);
    if (w === W && Math.abs(h - H) < 1) return;
    W = w;
    H = h;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var fd = glOK ? 1 : dpr;   /* mit Shader genügt ein Beschlag in Bildschirmauflösung, spart Hochladen */
    cv.width = glOK ? 2 : Math.round(W * dpr);
    cv.height = glOK ? 2 : Math.round(H * dpr);
    fog.width = Math.round(W * fd);
    fog.height = Math.round(H * fd);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(glOK ? 1 : dpr, 0, 0, glOK ? 1 : dpr, 0, 0);
    fctx.setTransform(fd, 0, 0, fd, 0, 0);
    bg.width = Math.max(2, Math.round(W * 0.5));
    bg.height = Math.max(2, Math.round(H * 0.5));
    pm.width = pl.width = ll.width = W;
    pm.height = pl.height = ll.height = H;
    layerStale = true;
    initBlobs();
    paintBg(0);
    fogGrad = fctx.createLinearGradient(0, 0, 0, H);
    fogGrad.addColorStop(0, 'rgb(196,199,202)');
    fogGrad.addColorStop(1, 'rgb(160,164,168)');
    fillFog(1);
    initWet();
    initLake();
    if (glOK) glResize();
    seedDrops();
  }

  /* ---------- Feuchte Bahnen: Spuren, in denen Tropfen mitgerissen werden ---------- */
  var WC = 4, wcols = 0, wrows = 0, wet = null, wdx = null, wdy = null, wid = null;

  function initWet() {
    wcols = Math.ceil(W / WC) + 1;
    wrows = Math.ceil(H / WC) + 1;
    wet = new Uint8Array(wcols * wrows);
    wdx = new Int8Array(wcols * wrows);
    wdy = new Int8Array(wcols * wrows);
    wid = new Uint16Array(wcols * wrows);
    initGlass();
  }

  /* ---------- Glasoberfläche: Kalk, Schmutz, Rauheit (fest) und Nebeldichte (wächst nach) ---------- */
  var kal = null, mic = null, emi = null;   /* emi: Neigung zur Neukondensation (nach dem Wischen kurz aufgehoben) */
  var MIC_K = 0.05;
  var ATTRACT = 0;   /* Zug stehender Tropfen auf Läufer */

  function makeNoise(cols, rows, S, rr) {
    var lw = Math.ceil(cols / S) + 2, lh = Math.ceil(rows / S) + 2, lat = new Float32Array(lw * lh), i;
    for (i = 0; i < lat.length; i++) lat[i] = rr();
    var out = new Float32Array(cols * rows);
    for (var y = 0; y < rows; y++) {
      var fy = y / S, iy = Math.floor(fy), ty = fy - iy;
      ty = ty * ty * (3 - 2 * ty);
      for (var x = 0; x < cols; x++) {
        var fx = x / S, ix = Math.floor(fx), tx = fx - ix;
        tx = tx * tx * (3 - 2 * tx);
        var a = lat[iy * lw + ix], b = lat[iy * lw + ix + 1], c = lat[(iy + 1) * lw + ix], d = lat[(iy + 1) * lw + ix + 1];
        out[y * cols + x] = (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
      }
    }
    return out;
  }

  function initGlass() {
    var n = wcols * wrows, rr = seeded(7919), i;
    var n1 = makeNoise(wcols, wrows, 3, rr), n2 = makeNoise(wcols, wrows, 9, rr), n3 = makeNoise(wcols, wrows, 5, rr);
    kal = new Float32Array(n);
    mic = new Float32Array(n);
    emi = new Float32Array(n).fill(1);
    for (i = 0; i < n; i++) {
      kal[i] = 0.34 * n1[i] + 0.2 * n2[i];
      mic[i] = 0.3 + 0.5 * n3[i];
    }
    /* Kalkflecken: einzelne, scharf begrenzte Haftstellen */
    var spots = Math.round(W * H / 7000);
    for (var k = 0; k < spots; k++) {
      var sx = rr() * W, sy = rr() * H, srad = 3 + rr() * 7, str = 0.7 + rr() * 1.1;
      var cx0 = Math.max(0, Math.floor((sx - srad) / WC)), cx1 = Math.min(wcols - 1, Math.floor((sx + srad) / WC));
      var cy0 = Math.max(0, Math.floor((sy - srad) / WC)), cy1 = Math.min(wrows - 1, Math.floor((sy + srad) / WC));
      for (var cy = cy0; cy <= cy1; cy++) {
        for (var cx = cx0; cx <= cx1; cx++) {
          var dd = Math.hypot((cx + 0.5) * WC - sx, (cy + 0.5) * WC - sy) / srad;
          if (dd < 1) kal[cy * wcols + cx] += str * (1 - dd * dd);
        }
      }
    }
  }

  function pinAt(x, y) {
    var i = wetIdx(x, y);
    return i < 0 ? 0.3 : kal[i];
  }

  function micAt(x, y) {
    var i = wetIdx(x, y);
    return i < 0 ? 0 : mic[i];
  }

  /* kritische Fläche r^2, ab der der Tropfen an dieser Stelle losrutscht */
  function rcAt(x, y, rs) {
    return rs * rs * (1 + Math.min(pinAt(x, y), PIN_CAP));   /* auch stark haftende Stellen halten nur begrenzt: große Tropfen laufen immer */
  }

  /* Der Tropfen nimmt den Nebel auf, den er überstreicht */
  function harvest(x, y, rad, dist) {
    var frac = Math.min(1, dist / WC), got = 0;
    var cx0 = Math.max(0, Math.floor((x - rad) / WC)), cx1 = Math.min(wcols - 1, Math.floor((x + rad) / WC));
    var cy0 = Math.max(0, Math.floor((y - rad) / WC)), cy1 = Math.min(wrows - 1, Math.floor((y + rad) / WC));

                pr
              );
            }
          }
          d.x = nx;
          d.y = ny;
        }
        if (net <= 0 && sp < 0.12) {
          d.slide = false;
          d.vx = d.vy = 0;
        }
        if (d.r < 1.0 || d.y > H + d.r + 4 || d.y < -40 || d.x < -40 || d.x > W + 40) d.dead = true;
      } else {
        var wi2 = d.r > 3.2 && gm > 0.1 ? wetIdx(d.x, d.y) : -1;
        var ttx = 0, tty = 0, tok = false;
        if (wi2 >= 0 && wet[wi2] > 127 && wid[wi2] !== d.id) {
          ttx = wdx[wi2] / 127;
          tty = wdy[wi2] / 127;
          if (ttx * gx + tty * gy < 0) { ttx = -ttx; tty = -tty; }
          tok = ttx * gx + tty * gy > 0.3;
        }
        if (tok && !d.into) {
          /* Tropfen sitzt in einer feuchten Bahn: wird als Wasser der Bahn mitgerissen */
          d.slide = true;
          d.vx = ttx * 1.2;
          d.vy = tty * 1.2;
          d.age = 60;
        } else if (!d.into && gm > 0.05 && d.r * d.r > rcL * d.thr) {
          d.slide = true;
          d.vx = gx * 0.7 * SPEED;   /* Losreißen: kurzer Ruck */
          d.vy = gy * 0.7 * SPEED;
          d.age = 0;
        } else if (d.r > 1.6 && d.r < Math.sqrt(rcL) * 1.1) {
          d.r += 0.009 * f;
        }
      }
    }

    processPearls();
    flowMerges(f);
    lakeFrame(f);

    /* Verschmelzen über ein grobes Raster */
    var MCS = 40;
    var cols = Math.ceil(W / MCS) + 2;
    var rows = Math.ceil(H / MCS) + 2;
    var grid = new Array(cols * rows);
    var m = drops.length, k, cx, cy;
    for (i = 0; i < m; i++) {
      d = drops[i];
      if (d.dead) continue;
      cx = Math.max(0, Math.min(cols - 1, Math.floor(d.x / MCS) + 1));
      cy = Math.max(0, Math.min(rows - 1, Math.floor(d.y / MCS) + 1));
      k = cy * cols + cx;
      if (grid[k]) grid[k].push(i); else grid[k] = [i];
    }
    for (i = 0; i < m; i++) {
      d = drops[i];
      if (d.dead) continue;
      cx = Math.max(0, Math.min(cols - 1, Math.floor(d.x / MCS) + 1));
      cy = Math.max(0, Math.min(rows - 1, Math.floor(d.y / MCS) + 1));
      for (var yy = cy - 1; yy <= cy + 1; yy++) {
        if (yy < 0 || yy >= rows) continue;
        for (var xx = cx - 1; xx <= cx + 1; xx++) {
          if (xx < 0 || xx >= cols) continue;
          var cell = grid[yy * cols + xx];
          if (!cell) continue;
          for (var q = 0; q < cell.length; q++) {
            var j = cell[q];
            if (j <= i) continue;
            var e = drops[j];
            if (e.dead || d.dead) continue;
            var reach = (d.r + e.r) * 1.05 + 1.2 + 0.5 * (Math.abs(d.vx) + Math.abs(d.vy) + Math.abs(e.vx) + Math.abs(e.vy));
            if (Math.hypot(d.x - e.x, d.y - e.y) < reach) startMerge(d, e);
          }
        }
      }
    }

    /* Große Wasserflächen finden sich auch über das grobe Raster hinaus */
    var bigs = [];
    for (i = 0; i < drops.length; i++) {
      if (!drops[i].dead && !drops[i].into && drops[i].r >= 14) bigs.push(drops[i]);
    }
    for (i = 0; i < bigs.length; i++) {
      for (var j2 = i + 1; j2 < bigs.length; j2++) {
        var p = bigs[i], q2 = bigs[j2];
        if (p.into || q2.into) continue;
        if (Math.hypot(p.x - q2.x, p.y - q2.y) < (p.r + q2.r) * 0.9) startMerge(p, q2);
      }
    }

    var alive = [];
    for (i = 0; i < drops.length; i++) if (!drops[i].dead) alive.push(drops[i]);
    drops = alive;

    if (tick % 36 === 0) { fillFog(0.08); decayWet(); regrowMic(); lakeRefog = true; }
  }

  /* ---------- Zeichnen ---------- */
  var rimCols = ['rgba(70,225,210,0.6)', 'rgba(120,235,150,0.55)', 'rgba(60,140,235,0.55)', 'rgba(235,250,235,0.5)', 'rgba(70,225,210,0.6)'];

  /* Maske der Wasserflächen aus dem Feld: zweimal weichgezeichnet, Rand bei Wert 0.5, bilinear hochgerechnet */
  function hBlur(src, dst, y0, y1) {
    for (var y = y0; y <= y1; y++) {
      var row = y * gw;
      for (var x = 1; x < gw - 1; x++) {
        var i = row + x;
        dst[i] = (src[i - 1] + 2 * src[i] + src[i + 1]) * 0.25;
      }
    }
  }

  function vBlur(src, dst, y0, y1) {
    for (var y = Math.max(1, y0); y <= Math.min(gh - 2, y1); y++) {
      var row = y * gw;
      for (var x = 1; x < gw - 1; x++) {
        var i = row + x;
        dst[i] = (src[i - gw] + 2 * src[i] + src[i + gw]) * 0.25;
      }
    }
  }

  function renderMask() {
    lakeDirty = false;
    var mw = pmS.width, mh = pmS.height, data = pmImg.data;
    var inv = RS / CS, px, py, i, y, x;
    var ymin = gh, ymax = -1, xmin = gw, xmax = -1;
    for (y = 0; y < gh; y++) {
      var rb = y * gw;
      for (x = 0; x < gw; x++) {
        if (phi[rb + x] > 0.01) {
          if (y < ymin) ymin = y;
          if (y > ymax) ymax = y;
          if (x < xmin) xmin = x;
          var x2 = gw - 1;
          while (x2 > x && phi[rb + x2] <= 0.01) x2--;
          if (x2 > xmax) xmax = x2;
          break;
        }
      }
    }
    if (ymax < 0) {
      lakeBox.x0 = lakeBox.y0 = lakeBox.x1 = lakeBox.y1 = 0;
      for (i = 3; i < data.length; i += 4) data[i] = 0;
    } else {
      lakeBox.x0 = Math.max(0, Math.floor((xmin - 5) * CS));
      lakeBox.y0 = Math.max(0, Math.floor((ymin - 5) * CS));
      lakeBox.x1 = Math.min(W, Math.ceil((xmax + 6) * CS));
      lakeBox.y1 = Math.min(H, Math.ceil((ymax + 6) * CS));
      var y0 = Math.max(1, ymin - 4), y1 = Math.min(gh - 2, ymax + 4);
      rbuf.fill(0);
      rtmp.fill(0);
      hBlur(phi, rtmp, y0, y1);
      vBlur(rtmp, rbuf, y0, y1);
      hBlur(rbuf, rtmp, y0, y1);
      vBlur(rtmp, rbuf, y0, y1);
      var lo = Math.max(0, ymin - 4), hi = Math.min(gh - 2, ymax + 4);
      for (py = 0; py < mh; py++) {
        var fy = (py + 0.5) * inv - 0.5;
        var iy = Math.floor(fy), ay = fy - iy;
        if (iy < 0) { iy = 0; ay = 0; }
        if (iy > gh - 2) { iy = gh - 2; ay = 1; }
        var o = py * mw * 4 + 3;
        if (iy + 1 < lo || iy > hi) {
          for (px = 0; px < mw; px++) data[o + px * 4] = 0;
          continue;
        }
        var r0 = iy * gw, r1 = r0 + gw;
        for (px = 0; px < mw; px++) {
          var fx = (px + 0.5) * inv - 0.5;
          var ix = Math.floor(fx), ax = fx - ix;
          if (ix < 0) { ix = 0; ax = 0; }
          if (ix > gw - 2) { ix = gw - 2; ax = 1; }
          var v = (rbuf[r0 + ix] * (1 - ax) + rbuf[r0 + ix + 1] * ax) * (1 - ay) + (rbuf[r1 + ix] * (1 - ax) + rbuf[r1 + ix + 1] * ax) * ay;
          var a = 0.5 + (v * RLIFT - MASK_C) * 3.2;
          data[o + px * 4] = a <= 0 ? 0 : (a >= 1 ? 255 : (a * 255) | 0);
        }
      }
    }
    pmSc.putImageData(pmImg, 0, 0);
    pmc.setTransform(1, 0, 0, 1, 0, 0);
    pmc.globalCompositeOperation = 'source-over';
    pmc.globalAlpha = 1;
    pmc.clearRect(0, 0, W, H);
    pmc.imageSmoothingEnabled = true;
    try { pmc.imageSmoothingQuality = 'high'; } catch (err) { /* ignorieren */ }
    pmc.drawImage(pmS, 0, 0, W, H);
    /* Beschlag nur dort räumen, wo das Wasser wirklich dick liegt: so bleiben keine blockigen Ränder zurück */
    var fd = pmFImg.data;
    for (i = 3; i < data.length; i += 4) fd[i] = data[i] >= 235 ? 255 : 0;
    pmFc.putImageData(pmFImg, 0, 0);
    pfc.setTransform(1, 0, 0, 1, 0, 0);
    pfc.clearRect(0, 0, W, H);
    pfc.imageSmoothingEnabled = true;
    pfc.drawImage(pmF, 0, 0, W, H);
  }

  function crescent(dx, dy, color) {
    var b = lakeBox, bx = b.x0, by = b.y0, bw = b.x1 - b.x0, bh = b.y1 - b.y0;
    plc.globalCompositeOperation = 'source-over';
    plc.clearRect(bx - 8, by - 8, bw + 16, bh + 16);
    plc.drawImage(pm, bx, by, bw, bh, bx, by, bw, bh);
    plc.globalCompositeOperation = 'destination-out';
    plc.drawImage(pm, bx, by, bw, bh, bx + dx, by + dy, bw, bh);
    plc.globalCompositeOperation = 'source-in';
    plc.fillStyle = color;
    plc.fillRect(bx, by, bw, bh);
    plc.globalCompositeOperation = 'source-over';
    llc.drawImage(pl, bx, by, bw, bh, bx, by, bw, bh);
  }

  /* Pfütze: Fläche ist eben und leuchtet, nur der Rand ist gewölbt und schimmert farbig.
     Die fertige Ebene wird zwischengespeichert und nur bei Änderung (oder alle paar Bilder für das Schimmern) neu gebaut. */
  function buildLakeLayer(t) {
    var b = lakeBox, bx = b.x0, by = b.y0, bw = b.x1 - b.x0, bh = b.y1 - b.y0;
    if (bw <= 0 || bh <= 0) return;
    llc.setTransform(1, 0, 0, 1, 0, 0);
    llc.globalAlpha = 1;
    llc.globalCompositeOperation = 'source-over';
    llc.clearRect(bx - 8, by - 8, bw + 16, bh + 16);
    plc.setTransform(1, 0, 0, 1, 0, 0);
    plc.globalAlpha = 1;

    plc.globalCompositeOperation = 'source-over';
    plc.clearRect(bx - 8, by - 8, bw + 16, bh + 16);
    /* Fläche: klares Wasser. Man sieht den Hintergrund fast unverändert, nur minimal versetzt und vergrößert (Brechung),
       etwas satter und leicht abgedunkelt. Die Fläche ist eben, daher keine Verzerrung im Inneren. */
    plc.save();
    plc.beginPath();
    plc.rect(bx, by, bw, bh);
    plc.clip();
    plc.translate(W / 2 + 4, H / 2 + 6);
    plc.scale(1.04, 1.04);
    plc.drawImage(bg, -W / 2, -H / 2, W, H);
    plc.restore();
    plc.globalCompositeOperation = 'source-over';
    plc.fillStyle = 'rgba(8,52,84,0.16)';
    plc.fillRect(bx, by, bw, bh);
    /* Verläufe wie bei Wasser auf Metall: oben links aufgehellt, unten rechts dunkler, dazu ein zweiter, flacher Verlauf */
    var lg = plc.createLinearGradient(0, 0, W, H);
    lg.addColorStop(0, 'rgba(255,255,255,0.16)');
    lg.addColorStop(0.45, 'rgba(255,255,255,0)');
    lg.addColorStop(1, 'rgba(0,22,48,0.2)');
    plc.fillStyle = lg;
    plc.fillRect(bx, by, bw, bh);
    var lg2 = plc.createLinearGradient(W, 0, 0, H * 0.6);
    lg2.addColorStop(0, 'rgba(120,230,220,0.1)');
    lg2.addColorStop(0.5, 'rgba(120,230,220,0)');
    lg2.addColorStop(1, 'rgba(40,90,200,0.1)');
    plc.fillStyle = lg2;
    plc.fillRect(bx, by, bw, bh);
    /* Spiegelung eines Fensters: breites, weiches Lichtband, das langsam über das Wasser wandert */
    var sx = ((t * 16) % (W * 1.7)) - W * 0.4;
    var sg = plc.createLinearGradient(sx, 0, sx + W * 0.4, H * 0.4);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0.2)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    plc.fillStyle = sg;
    plc.fillRect(bx, by, bw, bh);
    plc.globalCompositeOperation = 'destination-in';
    plc.drawImage(pm, bx, by, bw, bh, bx, by, bw, bh);
    plc.globalCompositeOperation = 'source-over';
    llc.drawImage(pl, bx, by, bw, bh, bx, by, bw, bh);

    plc.clearRect(bx - 8, by - 8, bw + 16, bh + 16);
    plc.drawImage(pm, bx, by, bw, bh, bx, by, bw, bh);
    plc.globalCompositeOperation = 'destination-out';
    var E = 7;
    for (var k = 0; k < 8; k++) {
      var an = k * Math.PI / 4;
      plc.drawImage(pm, bx, by, bw, bh, bx + Math.cos(an) * E, by + Math.sin(an) * E, bw, bh);
    }
    plc.globalCompositeOperation = 'source-in';
    /* Randband: gewölbte Kante zeigt den Hintergrund verkehrt herum und gestaucht, wie bei den Tropfen */
    plc.save();
    plc.translate(W / 2, H / 2);
    plc.rotate(Math.PI);
    plc.scale(0.7, 0.7);
    plc.drawImage(bg, -W / 2, -H / 2, W, H);
    plc.restore();
    var gx = Math.sin(t * 0.15) * W * 0.4 - W * 0.1;
    var rg = plc.createLinearGradient(gx, 0, gx + W * 1.2, H);
    for (var s2 = 0; s2 < rimCols.length; s2++) rg.addColorStop(s2 / (rimCols.length - 1), rimCols[s2]);
    plc.fillStyle = rg;
    plc.fillRect(bx, by, bw, bh);
    plc.globalCompositeOperation = 'source-over';
    llc.globalAlpha = 0.6;
    llc.drawImage(pl, bx, by, bw, bh, bx, by, bw, bh);
    llc.globalAlpha = 1;

    /* Kanten wie bei echtem Wasser: dunkle Außenlinie unten rechts, helle Spiegelung oben links,
       innen gegenüber eine schmale Lichtbündelung */
    /* weiche Innenverläufe an den Rändern: viele schmale Streifen mit kleiner Deckkraft ergeben einen Verlauf */
    for (var gk = 1; gk <= 4; gk++) crescent(-gk * 2.8, -gk * 2.8, 'rgba(0,18,40,0.07)');
    for (gk = 1; gk <= 3; gk++) crescent(gk * 2.6, gk * 2.6, 'rgba(255,255,255,0.06)');
    crescent(-4, -4, 'rgba(0,10,24,0.45)');
    crescent(3, 3, 'rgba(255,255,255,0.7)');
    crescent(-2, -2, 'rgba(190,255,240,0.35)');
    crescent(1, 1, 'rgba(255,255,255,0.55)');
  }

  function draw() {
    if (glOK) { drawGL(); return; }
    var i, d, t = tick / 60;
    var big = [];
    if (tick % 2 === 0) paintBg(t);
    if (lakeM > 0.5 || lakeDirty) {
      var rendered = false;
      if (lakeDirty) { renderMask(); rendered = true; layerStale = true; }
      var cb = lakeBox;
      if ((rendered || lakeRefog) && cb.x1 > cb.x0) {
        /* Wasser räumt den Beschlag unter sich weg */
        fctx.globalCompositeOperation = 'destination-out';
        fctx.drawImage(pf, cb.x0, cb.y0, cb.x1 - cb.x0, cb.y1 - cb.y0, cb.x0, cb.y0, cb.x1 - cb.x0, cb.y1 - cb.y0);
        fctx.globalCompositeOperation = 'source-over';
      }
      lakeRefog = false;
    }

    ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0, W, H);
    ctx.globalAlpha = 0.5;
    ctx.drawImage(fog, 0, 0, W, H);
    ctx.globalAlpha = 1;
    if (lakeM > 0.5) {
      if (layerStale || tick % 12 === 0) { buildLakeLayer(t); layerStale = false; }
      var lb = lakeBox;
      if (lb.x1 > lb.x0) ctx.drawImage(ll, lb.x0, lb.y0, lb.x1 - lb.x0, lb.y1 - lb.y0, lb.x0, lb.y0, lb.x1 - lb.x0, lb.y1 - lb.y0);
    }

    /* kleine Tröpfchen gesammelt zeichnen */
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    for (i = 0; i < drops.length; i++) {
      d = drops[i];
      if (d.r < 2.4) { ctx.moveTo(d.x + d.r, d.y + d.r * 0.4); ctx.arc(d.x, d.y + d.r * 0.4, d.r, 0, TAU); } else big.push(d);
    }
    ctx.fill();
    ctx.fillStyle = 'rgba(226,239,251,0.34)';
    ctx.beginPath();
    for (i = 0; i < drops.length; i++) {
      d = drops[i];
      if (d.r < 2.4) { ctx.moveTo(d.x + d.r, d.y); ctx.arc(d.x, d.y, d.r, 0, TAU); }
    }
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    for (i = 0; i < drops.length; i++) {
      d = drops[i];
      if (d.r < 2.4 && d.r > 1.1) {
        var hr = d.r * 0.32;
        ctx.moveTo(d.x - d.r * 0.3 + hr, d.y - d.r * 0.3);
        ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, hr, 0, TAU);
      }
    }
    ctx.fill();

    /* Tropfen: gespiegelter, verkleinerter Hintergrund als Brechung, bunte Reflexe */
    for (i = 0; i < big.length; i++) {
      d = big[i];
      var sa = d.ghost > 0 ? Math.min(1, d.ghost / 10) : 1;
      var x = d.x, y = d.y, r = d.r;
      ctx.globalAlpha = sa;

      /* Form: laufende und große Tropfen werden entlang der Bewegung bzw. senkrecht oval */
      var vs = Math.hypot(d.vx, d.vy);
      var el = 1 + Math.min(0.55, (d.slide ? vs * 0.1 : 0) + Math.max(0, r - 8) * 0.025);
      var ea = vs > 0.15 ? Math.atan2(d.vy, d.vx) - Math.PI / 2 : (Math.atan2(grav.y, grav.x) - Math.PI / 2);
      var ex = 1 / Math.sqrt(el), ey = Math.sqrt(el);

      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.save();
      ctx.translate(x + r * 0.06, y + r * 0.22);
      ctx.rotate(ea);
      ctx.scale(ex, ey);
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.03, 0, TAU);
      ctx.restore();
      ctx.fill();

      ctx.beginPath();
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ea);
      ctx.scale(ex, ey);
      ctx.arc(0, 0, r, 0, TAU);
      ctx.restore();
      ctx.save();
      ctx.clip();
      ctx.translate(x, y);
      ctx.rotate(Math.PI);
      ctx.scale(0.6, 0.6);
      ctx.drawImage(bg, -x, -y, W, H);
      ctx.restore();

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ea);
      ctx.scale(ex, ey);
      var g = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r);
      g.addColorStop(0, 'rgba(255,255,255,0.12)');
      g.addColorStop(0.7, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.34)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.fill();

      /* leichte Farbsäume wie bei einer Linse */
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(60,150,255,0.4)';
      ctx.beginPath();
      ctx.arc(-0.7, -0.3, r, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(120,255,170,0.36)';
      ctx.beginPath();
      ctx.arc(0.7, 0.3, r, 0, TAU);
      ctx.stroke();

      /* farbige Lichtreflexe, je Tropfen eine andere Tönung */
      ctx.fillStyle = 'hsla(' + d.hue.toFixed(0) + ',95%,72%,0.42)';
      ctx.beginPath();
      ctx.arc(r * 0.15, r * 0.52, r * 0.28, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'hsla(' + (d.hue > 190 ? d.hue - 50 : d.hue + 50).toFixed(0) + ',90%,68%,0.32)';
      ctx.beginPath();
      ctx.arc(r * 0.42, -r * 0.3, r * 0.14, 0, TAU);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.beginPath();
      ctx.ellipse(-r * 0.32, -r * 0.38, r * 0.2, r * 0.12, -0.6, 0, TAU);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- Berührung ---------- */
  var ptr = null;
  var fingerOn = false, fingerX = 0, fingerY = 0, fvx = 0, fvy = 0;

  function gravUnit() {
    var gl = Math.hypot(grav.x, grav.y) || 1;
    return { x: grav.x / gl, y: grav.y / gl };
  }


  /* Gesammeltes Wasser macht die Fingerbewegung direkt mit */
  function carryHeld(dx, dy) {
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      if (d.held && !d.dead) {
        if (d.r > 2.5) markWet(d.x, d.y, d.x + dx, d.y + dy, Math.min(14, d.r * 0.8), 255, d.id);
        d.x += dx;
        d.y += dy;
      }
    }
  }

  /* Mitgeführte Körper nehmen einander und frisch aufgenommene Tropfen vollständig auf (Flächen addieren sich) */
  function mergeHeld() {
    var best = null, i, d;
    for (i = 0; i < drops.length; i++) {
      d = drops[i];
      if (d.held && !d.dead && (!best || d.r > best.r)) best = d;
    }
    if (!best) return;
    for (i = 0; i < drops.length; i++) {
      d = drops[i];
      if (d === best || !d.held || d.dead) continue;
      if (Math.hypot(d.x - best.x, d.y - best.y) < 26 + best.r * 0.5 + d.r) {
        best.r = Math.sqrt(best.r * best.r + d.r * d.r);
        d.dead = true;
      }
    }
  }

  /* Tropfen in Fingernähe bleiben am Finger haften, keiner geht verloren */
  function grabDrops(x, y, px, py) {
    if (px === undefined) { px = x; py = y; }
    var sdx = x - px, sdy = y - py, sl2 = sdx * sdx + sdy * sdy;
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      if (d.dead || d.held || d.into || d.ghost > 0 || d.r >= ARM0) continue;
      var tt = sl2 > 0 ? Math.max(0, Math.min(1, ((d.x - px) * sdx + (d.y - py) * sdy) / sl2)) : 1;
      var qx = px + sdx * tt, qy = py + sdy * tt, dq = Math.hypot(d.x - qx, d.y - qy);
      if (pulling && lakeM > 0.5 && dq < FR + d.r) {
        /* Tropfen, die der Finger beim Ziehen trifft, gehen mit ihrem Volumen in den Arm ein */
        if (pullHead && !pullHead.dead) pullHead.r = Math.sqrt(pullHead.r * pullHead.r + d.r * d.r);
        else { d.held = true; d.slide = false; d.vx = d.vy = 0; continue; }
        d.dead = true;
        continue;
      }
      if (dq < FR + d.r) {
        d.held = true;
        d.slide = false;
        d.vx = d.vy = 0;
      }
    }
  }

  function releaseHeld() {
    pulling = false;
    pullHead = null;
    pullFree = false;
    needExit = false;
    var u = gravUnit();
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      if (!d.held) continue;
      d.held = false;
      if (!lakeMode || !(d.anc || (d.r >= 12 && d.r >= LAKE_R0))) { d.ch = null; d.anc = null; }
      if (lakeMode && (d.anc || (d.r >= 12 && d.r >= LAKE_R0))) {
        paintBodyToLake(d);
        d.dead = true;
        continue;
      }
      if (d.r > 3) {
        d.slide = true;
        d.phase = 1;
        d.timer = 12;
        d.hx = u.x;
        d.hy = u.y;
        d.zig = 0;
        d.age = 60;
        d.vx = Math.max(-5, Math.min(5, fvx * 0.6));
        d.vy = Math.max(-5, Math.min(5, fvy * 0.6));
      }
    }
    fingerOn = false;
    fvx = fvy = 0;
  }

  function paintBodyToLake(d) {
    var budget = Math.PI * d.r * d.r / (CS * CS), got = 0;
    chainEach(d, function (x, y, r) { if (got < budget) got += lakeDisc(x, y, r, true, false); });
    var rem = budget - got;
    if (rem > 0.25) growQ.push({ x: d.x, y: d.y, m: rem });
    d.ch = null;
    d.anc = null;
  }

  function tap(x, y) {
    var best = null, bd = 1e9, i, d, dist;
    for (i = 0; i < drops.length; i++) {
      d = drops[i];
      if (d.dead || d.r < 2 || (d.r >= ARM0 && grav.m < FLAT_OFF)) continue;
      dist = Math.hypot(d.x - x, d.y - y);
      if (dist < d.r + 30 && dist < bd) { bd = dist; best = d; }
    }
    if (!best) { wipeDot(x, y, 14); return; }
    var u = gravUnit();
    best.slide = true;
    best.age = 60;
    best.phase = 1;
    best.timer = 22;
    best.hx = u.x;
    best.hy = u.y;
    if (grav.m > 0.2) {
      best.vx += u.x * 3.2;
      best.vy += u.y * 3.2;
    } else {
      var ax = best.x - x, ay = best.y - y;
      var l = Math.hypot(ax, ay) || 1;
      best.vx += (ax / l) * 3;
      best.vy += (ay / l) * 3;
      best.hx = ax / l;
      best.hy = ay / l;
    }
  }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignorieren */ }
    ptr = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
    armGid++;
    armQ = [];
    armQh = 0;
    pulling = false;
    pullHead = null;
  });
  cv.addEventListener('pointermove', function (e) {
    if (!ptr) return;
    var x = e.clientX, y = e.clientY;
    if (Math.hypot(x - ptr.sx, y - ptr.sy) > 9) ptr.moved = true;
    if (ptr.moved) {
      wipeLine(ptr.x, ptr.y, x, y, 34);
      markWet(ptr.x, ptr.y, x, y, 34, 0, 0);
      fvx = fvx * 0.6 + (x - ptr.x) * 0.4;
      fvy = fvy * 0.6 + (y - ptr.y) * 0.4;
      fingerOn = true;
      fingerX = x;
      fingerY = y;
      if (lakeMode && !draining) {
        penMove(ptr.x, ptr.y, x, y);
        penDrops(x, y, ptr.x, ptr.y);
      } else {
        if (penRes > 0) penRelease(ptr.x, ptr.y);
        carryHeld(x - ptr.x, y - ptr.y);
        grabDrops(x, y, ptr.x, ptr.y);
      }
    }
    ptr.x = x;
    ptr.y = y;
  });
  /* Doppeltipp blendet die Bedienleiste ein oder aus */
  var lastTap = { t: -1e9, x: 0, y: 0 };
  function release(e) {
    if (ptr && !ptr.moved && performance.now() - ptr.t < 500) {
      var now = performance.now();
      if (now - lastTap.t < 320 && Math.hypot(ptr.sx - lastTap.x, ptr.sy - lastTap.y) < 40) {
        var barEl = document.getElementById('bar');
        if (barEl) barEl.hidden = !barEl.hidden;
        lastTap.t = -1e9;
      } else {
        lastTap = { t: now, x: ptr.sx, y: ptr.sy };
        tap(ptr.sx, ptr.sy);
      }
    }
    if (ptr) penRelease(ptr.x, ptr.y);
    releaseHeld();
    ptr = null;
  }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', function () { if (ptr) penRelease(ptr.x, ptr.y); releaseHeld(); ptr = null; });

  /* ---------- Lage des Glases ---------- */
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.modes button'));
  var noteTimer = 0;
  var sensorSeen = false;
  var sensorBound = false;

  function say(text) {
    if (!noteEl) return;
    noteEl.textContent = text;
    clearTimeout(noteTimer);
    if (text) noteTimer = setTimeout(function () { noteEl.textContent = ''; }, 5000);
  }

  function setMode(m) {
    mode = m;
    if (typeof syncTilt === 'function') syncTilt(m);
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mode') === m ? 'true' : 'false'); });
    if (m === 'up') { gT.x = 0; gT.y = 1; gT.m = 1; }
    else if (m === 'left') { gT.x = -0.6; gT.y = 0.8; gT.m = 1; }
    else if (m === 'right') { gT.x = 0.6; gT.y = 0.8; gT.m = 1; }
    else if (m === 'flat') { gT.x = 0; gT.y = 1; gT.m = 0.03; }
  }

  function onOri(e) {
    if (e.beta == null) return;
    sensorSeen = true;
    if (mode !== 'sensor') return;
    var b = Math.max(-90, Math.min(90, e.beta)) * Math.PI / 180;
    var g = Math.max(-90, Math.min(90, e.gamma || 0)) * Math.PI / 180;
    var gy = Math.sin(b), gx = Math.sin(g);
    gT.m = Math.min(1, Math.hypot(gx, gy));
    if (gT.m < 0.05) { gT.x = 0; gT.y = 1; } else { gT.x = gx; gT.y = gy; }
  }

  function sensorFailed() {
    say('Der Lagesensor ist hier nicht verfügbar. Die Lage lässt sich mit den Tasten einstellen.');
    setMode('up');
  }

  function startSensor() {
    mode = 'sensor';
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mode') === 'sensor' ? 'true' : 'false'); });
    sensorSeen = false;
    var ask = Promise.resolve('granted');
    try {
      if (window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission === 'function') {
        ask = window.DeviceOrientationEvent.requestPermission();
      }
    } catch (err) { ask = Promise.reject(err); }
    ask.then(function (res) {
      if (res !== 'granted') { sensorFailed(); return; }
      if (!sensorBound) { window.addEventListener('deviceorientation', onOri); sensorBound = true; }
      setTimeout(function () { if (!sensorSeen && mode === 'sensor') sensorFailed(); }, 1500);
    }).catch(sensorFailed);
  }

  var tiltEl = document.getElementById('tilt'), tiltV = document.getElementById('tiltv');
  function applyTilt() {
    if (!tiltEl) return;
    var a = parseFloat(tiltEl.value), r = a * Math.PI / 180;
    if (tiltV) tiltV.textContent = a.toFixed(1).replace('.0', '') + '°';
    mode = 'slider';
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
    gT.x = 0; gT.y = 1; gT.m = Math.max(0.03, Math.sin(r));
  }
  if (tiltEl) tiltEl.addEventListener('input', applyTilt);
  function syncTilt(m) {
    if (!tiltEl) return;
    var v = m === 'up' || m === 'left' || m === 'right' ? 90 : 0;
    if (m === 'flat' || v === 90) {
      tiltEl.value = v;
      if (tiltV) tiltV.textContent = v + '°';
    }
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      var m = b.getAttribute('data-mode');
      if (m === 'sensor') startSensor(); else setMode(m);
    });
  });

  /* ---------- Start ---------- */

  /* ---------- WebGL-Darstellung ----------
     Alles Wasser (Tropfen, Seen, nasse Spuren) wird zuerst als Karte aus Oberflächenneigung und Brechkraft gezeichnet.
     Ein einziger Shader rechnet daraus Brechung des Hintergrunds, Fresnel-Reflexion, Glanzlicht, Randdunkelheit und Kaustik.
     So unterscheidet sich ein See von einem Tropfen nur noch durch die Form seiner Oberfläche. */
  var GL = {};
  var VS_DROP = '#version 300 es\n' +
    'precision highp float;\n' +
    'in vec2 aCorner; in vec4 aA; in vec2 aB; in float aC;\n' +
    'uniform vec2 uRes;\n' +
    'out vec2 vLocal; out vec2 vAxes; out float vR; out float vAng; out float vAlpha; out float vFlat;\n' +
    'void main(){\n' +
    '  float r = aA.z, el = aA.w;\n' +
    '  float ax = r / sqrt(el), ay = r * sqrt(el);\n' +
    '  vec2 local = aCorner * vec2(ax + 2.0, ay + 2.0);\n' +
    '  float c = cos(aB.x), s = sin(aB.x);\n' +
    '  vec2 world = aA.xy + vec2(c*local.x - s*local.y, s*local.x + c*local.y);\n' +
    '  gl_Position = vec4(world / uRes * 2.0 - 1.0, 0.0, 1.0);\n' +
    '  vLocal = local; vAxes = vec2(ax, ay); vR = r; vAng = aB.x; vAlpha = aB.y; vFlat = aC;\n' +
    '}\n';
  var FS_DROP = '#version 300 es\n' +
    'precision highp float;\n' +
    'in vec2 vLocal; in vec2 vAxes; in float vR; in float vAng; in float vAlpha; in float vFlat;\n' +
    'out vec4 o;\n' +
    'void main(){\n' +
    '  vec2 q = vLocal / vAxes;\n' +
    '  float d = length(q);\n' +
    '  float px = 1.0 / min(vAxes.x, vAxes.y);\n' +
    '  float cov = 1.0 - smoothstep(1.0 - px, 1.0 + 0.5 * px, d);\n' +
    '  if (cov <= 0.0) discard;\n' +
    '  float sn = 0.88;\n' +                                   /* Randwinkel der Kappe */
    '  vec2 nl = mix(q * sn, q / max(d, 0.001) * 0.95 * smoothstep(0.7, 1.0, d), vFlat);\n' +
    '  float c = cos(vAng), s = sin(vAng);\n' +
    '  vec2 n = vec2(c*nl.x - s*nl.y, s*nl.x + c*nl.y);\n' +
    '  float reff = max(mix(1.6 * vR / sn, 14.0, vFlat), 10.0);\n' +
    '  o = vec4(n * 0.5 + 0.5, clamp(reff / 64.0, 0.0, 1.0), cov * vAlpha);\n' +
    '}\n';
  var VS_FS = '#version 300 es\n' +
    'precision highp float;\n' +
    'in vec2 aCorner;\n' +
    'out vec2 vUv;\n' +
    'void main(){ gl_Position = vec4(aCorner, 0.0, 1.0); vUv = aCorner * 0.5 + 0.5; }\n';
  var FS_FIELD = '#version 300 es\n' +
    'precision highp float;\n' +
    'in vec2 vUv;\n' +
    'uniform sampler2D uLake; uniform sampler2D uWet;\n' +
    'uniform vec2 uRes; uniform vec2 uLakeDim; uniform float uCS; uniform vec2 uWetDim; uniform float uWC; uniform float uLakeOn;\n' +
    'out vec4 o;\n' +
    'float lk(vec2 p){ return texture(uLake, p / (uLakeDim * uCS)).r * 1.2; }\n' +
    'float wr(vec2 p){ return texture(uWet, p / (uWetDim * uWC)).r; }\n' +
    'float wt(vec2 p){ float d = uWC * 0.9; float v = wr(p) * 0.28 + (wr(p + vec2(d, 0.)) + wr(p - vec2(d, 0.)) + wr(p + vec2(0., d)) + wr(p - vec2(0., d))) * 0.12 + (wr(p + vec2(d, d)) + wr(p - vec2(d, d)) + wr(p + vec2(d, -d)) + wr(p - vec2(d, -d))) * 0.06; return smoothstep(0.04, 0.95, v); }\n' +
    'void main(){\n' +
    '  vec2 p = vUv * uRes;\n' +
    '  float cov2 = 0.0; vec2 n2 = vec2(0.0);\n' +
    '  if (uLakeOn > 0.5) {\n' +
    '    float v = lk(p);\n' +
    '    cov2 = smoothstep(0.36, 0.64, v);\n' +
    '    vec2 g2 = vec2(lk(p + vec2(uCS,0.)) - lk(p - vec2(uCS,0.)), lk(p + vec2(0.,uCS)) - lk(p - vec2(0.,uCS))) / (2.0 * uCS);\n' +
    '    n2 = -g2 * 9.0;\n' +
    '    float l2 = length(n2); if (l2 > 0.95) n2 *= 0.95 / l2;\n' +
    '  }\n' +
    '  float w = wt(p);\n' +
    '  float cov1 = 0.42 * w;\n' +
    '  vec2 g1 = vec2(wt(p + vec2(uWC,0.)) - wt(p - vec2(uWC,0.)), wt(p + vec2(0.,uWC)) - wt(p - vec2(0.,uWC))) / (2.0 * uWC);\n' +
    '  vec2 n1 = -g1 * 2.0;\n' +
    '  float l1 = length(n1); if (l1 > 0.25) n1 *= 0.25 / l1;\n' +
    '  float a = cov2 + cov1 * (1.0 - cov2);\n' +
    '  if (a < 0.003) { o = vec4(0.5, 0.5, 0.0, 0.0); return; }\n' +
    '  vec2 n = (n2 * cov2 + n1 * cov1 * (1.0 - cov2)) / a;\n' +
    '  float reff = (14.0 * cov2 + 5.0 * cov1 * (1.0 - cov2)) / a;\n' +
    '  o = vec4(0.5 + 0.5 * n * a, reff * a / 64.0, a);\n' +
    '}\n';
  var FS_COMP = '#version 300 es\n' +
    'precision highp float;\n' +
    'in vec2 vUv;\n' +
    'uniform sampler2D uBg; uniform sampler2D uFog; uniform sampler2D uWater;\n' +
    'uniform vec2 uRes;\n' +
    'out vec4 o;\n' +
    'void main(){\n' +
    '  vec2 uv = vec2(vUv.x, 1.0 - vUv.y);\n' +
    '  vec2 p = uv * uRes;\n' +
    '  vec4 w = texture(uWater, uv);\n' +
    '  float cov = w.a;\n' +
    '  vec4 fogS = texture(uFog, uv);\n' +
    '  vec3 land = mix(texture(uBg, uv).rgb, fogS.rgb, fogS.a * 0.8);\n' +
    
    
    '  if (cov < 0.004) { o = vec4(land, 1.0); return; }\n' +
    '  vec2 n = (w.rg - 0.5) * 2.0 / cov;\n' +
    '  float reff = w.b * 64.0 / cov;\n' +
    '  float sl = min(length(n), 0.985);\n' +
    '  vec3 n3 = vec3(n, sqrt(1.0 - sl * sl));\n' +
    '  vec3 refr = texture(uBg, (p - n * reff) / uRes).rgb;\n' +
    '  vec2 nd = n / max(sl, 0.001);\n' +
    /* helle, ruhige Optik: Wasser fast im Ton des Glases, innen sanfte Verläufe, außen eine dunkle Kontur */
    '  vec3 wc = mix(land, refr, 0.25) * 1.02;\n' +
    '  wc *= 1.0 + 0.10 * n.y - 0.05 * n.x;\n' +
    '  wc *= 1.0 - 0.10 * smoothstep(0.25, 0.75, sl) * max(-n.y, 0.0) / max(sl, 0.001);\n' +
    '  wc *= 1.0 - 0.22 * smoothstep(0.55, 0.95, sl);\n' +
    '  vec3 L = normalize(vec3(-0.45, -0.62, 0.65));\n' +
    '  vec3 Hh = normalize(L + vec3(0.0, 0.0, 1.0));\n' +
    '  wc += vec3(pow(max(dot(n3, Hh), 0.0), 160.0) * 0.25);\n' +
    /* dünne Wasserfilme (Laufspuren): kaum heller als das Glas, nur angedeutete Kontur */
    '  float thin = 1.0 - smoothstep(5.5, 9.0, reff);\n' +
    '  vec3 tc = land * 1.04 * (1.0 - 0.06 * smoothstep(0.06, 0.22, sl));\n' +
    '  wc = mix(wc, tc, thin);\n' +
    '  float cv = mix(cov, min(1.0, cov * 1.8), thin);\n' +
    '  vec3 col = mix(land, wc, cv);\n' +
    /* dunkle Kontur genau an der Grenze der Wasserfläche, ringsum gleich; bei Laufspuren nur angedeutet */
    '  float edgeC = clamp(4.0 * cov * (1.0 - cov), 0.0, 1.0);\n' +
    '  col *= 1.0 - edgeC * mix(0.6, 0.03, thin);\n' +
    '  o = vec4(col, 1.0);\n' +
    '}\n';

  function glCompile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }

  function glProg(vs, fs) {
    var pr = gl.createProgram();
    gl.attachShader(pr, glCompile(gl.VERTEX_SHADER, vs));
    gl.attachShader(pr, glCompile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    return pr;
  }

  function glTex() {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  function initGL() {
    if (!glOK) return;
    try {
      GL.pDrop = glProg(VS_DROP, FS_DROP);
      GL.pField = glProg(VS_FS, FS_FIELD);
      GL.pComp = glProg(VS_FS, FS_COMP);
      var quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
      GL.qbuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, GL.qbuf);
      gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
      GL.ibuf = gl.createBuffer();
      GL.inst = new Float32Array((CAP + 600) * 7);
      /* VAO für die Tropfen */
      GL.vaoDrop = gl.createVertexArray();
      gl.bindVertexArray(GL.vaoDrop);
      gl.bindBuffer(gl.ARRAY_BUFFER, GL.qbuf);
      var lc = gl.getAttribLocation(GL.pDrop, 'aCorner');
      gl.enableVertexAttribArray(lc);
      gl.vertexAttribPointer(lc, 2, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, GL.ibuf);
      var la = gl.getAttribLocation(GL.pDrop, 'aA'), lb = gl.getAttribLocation(GL.pDrop, 'aB');
      gl.enableVertexAttribArray(la);
      gl.vertexAttribPointer(la, 4, gl.FLOAT, false, 28, 0);
      gl.vertexAttribDivisor(la, 1);
      gl.enableVertexAttribArray(lb);
      gl.vertexAttribPointer(lb, 2, gl.FLOAT, false, 28, 16);
      gl.vertexAttribDivisor(lb, 1);
      var lcF = gl.getAttribLocation(GL.pDrop, 'aC');
      gl.enableVertexAttribArray(lcF);
      gl.vertexAttribPointer(lcF, 1, gl.FLOAT, false, 28, 24);
      gl.vertexAttribDivisor(lcF, 1);
      /* VAO für Vollbild */
      GL.vaoFs = gl.createVertexArray();
      gl.bindVertexArray(GL.vaoFs);
      gl.bindBuffer(gl.ARRAY_BUFFER, GL.qbuf);
      var l0 = gl.getAttribLocation(GL.pField, 'aCorner');
      gl.enableVertexAttribArray(l0);
      gl.vertexAttribPointer(l0, 2, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);
      GL.tBg = glTex();
      GL.tFog = glTex();
      GL.tWater = glTex();
      GL.tLake = glTex();
      GL.tWet = glTex();
      GL.fbo = gl.createFramebuffer();
      GL.u = {};
      var names = {
        pDrop: ['uRes'],
        pField: ['uLake', 'uWet', 'uRes', 'uLakeDim', 'uCS', 'uWetDim', 'uWC', 'uLakeOn'],
        pComp: ['uBg', 'uFog', 'uWater', 'uRes']
      };
      for (var k in names) {
        GL.u[k] = {};
        for (var q = 0; q < names[k].length; q++) GL.u[k][names[k][q]] = gl.getUniformLocation(GL[k], names[k][q]);
      }
      glc.style.cssText = 'position:fixed;left:0;top:0;display:block;pointer-events:none';
      document.body.insertBefore(glc, cv);
    } catch (err) {
      glOK = false;
      gl = null;
      if (window.console) console.log('Shader nicht verfügbar, zeichne mit 2D:', err);
    }
  }

  function glResize() {
    var sd = Math.min(2, dpr);
    GL.fw = Math.round(W * sd);
    GL.fh = Math.round(H * sd);
    glc.width = GL.fw;
    glc.height = GL.fh;
    glc.style.width = W + 'px';
    glc.style.height = H + 'px';
    gl.bindTexture(gl.TEXTURE_2D, GL.tWater);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, GL.fw, GL.fh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, GL.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, GL.tWater, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    GL.lakeU8 = new Uint8Array(gw * gh);
    gl.bindTexture(gl.TEXTURE_2D, GL.tLake);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, gw, gh, 0, gl.RED, gl.UNSIGNED_BYTE, GL.lakeU8);
    gl.bindTexture(gl.TEXTURE_2D, GL.tWet);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, wcols, wrows, 0, gl.RED, gl.UNSIGNED_BYTE, wet);
    GL.lakeOn = 0;
    GL.bgDirty = true;
    GL.fogDirty = true;
  }

  function glUploadLake() {
    var i, n = gw * gh, v;
    rbuf.fill(0);
    rtmp.fill(0);
    for (i = 0; i < n; i++) { v = phi[i] + bphi[i]; bcomb[i] = v > 1 ? 1 : v; }
    hBlur(bcomb, rtmp, 1, gh - 2);
    vBlur(rtmp, rbuf, 1, gh - 2);
    hBlur(rbuf, rtmp, 1, gh - 2);
    vBlur(rtmp, rbuf, 1, gh - 2);
    var u8 = GL.lakeU8;
    for (i = 0; i < n; i++) {
      v = rbuf[i] * RLIFT / 1.2;
      u8[i] = v <= 0 ? 0 : (v >= 1 ? 255 : (v * 255) | 0);
    }
    gl.bindTexture(gl.TEXTURE_2D, GL.tLake);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, gw, gh, 0, gl.RED, gl.UNSIGNED_BYTE, u8);
  }

  function drawGL() {
    var t = tick / 60, i, d;
    if (tick % 2 === 0) {
      paintBg(t);
      gl.bindTexture(gl.TEXTURE_2D, GL.tBg);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, bg);
    } else if (GL.bgDirty) {
      gl.bindTexture(gl.TEXTURE_2D, GL.tBg);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, bg);
    }
    GL.bgDirty = false;
    if (tick % 2 === 1 || GL.fogDirty) {
      gl.bindTexture(gl.TEXTURE_2D, GL.tFog);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fog);
      GL.fogDirty = false;
      gl.bindTexture(gl.TEXTURE_2D, GL.tWet);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, wcols, wrows, 0, gl.RED, gl.UNSIGNED_BYTE, wet);
    }
    bodyOn = false;
    bphi.fill(0);
    for (i = 0; i < drops.length; i++) {
      d = drops[i];
      if (d.held && !d.dead && d.r >= 12 && grav.m < FLAT_OFF) { paintBody(d, bphi); bodyOn = true; }
    }
    var lakeOn = lakeM > 0.5 || bodyOn;
    if (lakeOn) {
      if (lakeDirty || bodyOn || GL.bodyWas) { glUploadLake(); lakeDirty = false; }
      GL.bodyWas = bodyOn;
    } else if (GL.lakeOn) {
      GL.lakeU8.fill(0);
      gl.bindTexture(gl.TEXTURE_2D, GL.tLake);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, gw, gh, 0, gl.RED, gl.UNSIGNED_BYTE, GL.lakeU8);
      lakeDirty = false;
    }
    GL.lakeOn = lakeOn ? 1 : 0;

    /* Instanzen der Tropfen, klein zuerst, damit große darüberliegen */
    var list = [];
    for (i = 0; i < drops.length; i++) {
      d = drops[i];
      if (!d.dead && d.r >= 0.6 && !(d.held && d.r >= 12 && grav.m < FLAT_OFF)) list.push(d);
    }
    list.sort(function (a, b) { return a.r - b.r; });
    var inst = GL.inst, n = Math.min(list.length, CAP + 600);
    for (i = 0; i < n; i++) {
      d = list[i];
      var vs = Math.hypot(d.vx, d.vy);
      var el = 1;   /* keine Verzerrung: Form entsteht nur aus dem Wasser selbst */
      var ea = vs > 0.15 ? Math.atan2(d.vy, d.vx) - Math.PI / 2 : (Math.atan2(grav.y, grav.x) - Math.PI / 2);
      var o = i * 7;
      inst[o] = d.x;
      inst[o + 1] = d.y;
      inst[o + 2] = d.r;
      inst[o + 3] = el;
      inst[o + 4] = ea;
      inst[o + 5] = d.ghost > 0 ? Math.min(1, d.ghost / 10) : 1;
      if (d.held && lakeMode && lakeM > 0.5) inst[o + 5] *= 1 - 0.92 * Math.min(1, lakeAt(d.x, d.y) * 1.2);
      var fl = (lakeMode && !draining && (!d.slide || grav.m < 0.15)) ? Math.max(0, Math.min(1, (d.r - (lakeR(d) - 2)) / 4)) : 0;   /* flach nur dort, wo auch ein See entsteht */
      inst[o + 6] = 0;
    }

    /* Pass 1: Wasserkarte */
    gl.bindFramebuffer(gl.FRAMEBUFFER, GL.fbo);
    gl.viewport(0, 0, GL.fw, GL.fh);
    gl.disable(gl.BLEND);
    gl.clearColor(0.5, 0.5, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(GL.pField);
    var uf = GL.u.pField;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, GL.tLake);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, GL.tWet);
    gl.uniform1i(uf.uLake, 0);
    gl.uniform1i(uf.uWet, 1);
    gl.uniform2f(uf.uRes, W, H);
    gl.uniform2f(uf.uLakeDim, gw, gh);
    gl.uniform1f(uf.uCS, CS);
    gl.uniform2f(uf.uWetDim, wcols, wrows);
    gl.uniform1f(uf.uWC, WC);
    gl.uniform1f(uf.uLakeOn, GL.lakeOn);
    gl.bindVertexArray(GL.vaoFs);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    if (n > 0) {
      gl.enable(gl.BLEND);
      gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(GL.pDrop);
      gl.uniform2f(GL.u.pDrop.uRes, W, H);
      gl.bindVertexArray(GL.vaoDrop);
      gl.bindBuffer(gl.ARRAY_BUFFER, GL.ibuf);
      gl.bufferData(gl.ARRAY_BUFFER, inst.subarray(0, n * 7), gl.DYNAMIC_DRAW);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
      gl.disable(gl.BLEND);
    }

    /* Pass 2: Zusammensetzen */
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, GL.fw, GL.fh);
    gl.useProgram(GL.pComp);
    var uc = GL.u.pComp;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, GL.tBg);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, GL.tFog);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, GL.tWater);
    gl.uniform1i(uc.uBg, 0);
    gl.uniform1i(uc.uFog, 1);
    gl.uniform1i(uc.uWater, 2);
    gl.uniform2f(uc.uRes, W, H);
    gl.bindVertexArray(GL.vaoFs);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);
  }

  initGL();
  resize();
  window.addEventListener('resize', resize);
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(50, now - last);
    last = now;
    step(dt / 16.667);
    draw();
    requestAnimationFrame(loop);
  }
  draw();
  requestAnimationFrame(loop);
})();
</script>

<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
